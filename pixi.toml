[workspace]
name = "arc-to-god"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.6"

[dependencies]
python = "3.11.*"
pytorch-gpu = ">=2.9.1,<3"
numpy = "*"
pyyaml = "*"

[tasks]
train = "python -m harness.train"
smoke = "python -m harness.train gpt2 --size s --no-record --set train.tokens=2e6 train.eval_every_tokens=1e6 train.warmup_tokens=2e5"
summarize = "python -m harness.summarize"
kg = "python scripts/kaggle.py"

[pypi-dependencies]
kaggle = "*"
