# Shared settings: every architecture trains and is evaluated with exactly these.
# Architecture files (configs/<arch>.yaml) may only set `model:` knobs and a
# shape per size. Anything that changes the comparison belongs here.

data:
  dir: data # enwik8 is downloaded here on first run

train:
  seq_len: 512
  batch_size: 32 # effective batch (sequences per optimizer step)
  micro_batch_size: 32 # lower this if an architecture runs out of memory; the effective batch stays the same
  tokens: 100_000_000 # token budget per run (~1.1 epochs of enwik8 train)
  lr: 1.0e-3
  min_lr_frac: 0.1 # cosine decays to lr * min_lr_frac
  warmup_tokens: 2_000_000
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  seed: 0
  compile: false
  log_every_steps: 50
  eval_every_tokens: 5_000_000
  eval_batches: 50 # fixed val batches used during training

model:
  dropout: 0.0

# Parameter budgets, counted WITHOUT embeddings. Each architecture picks a
# shape per size that lands within 10% of target_params (the harness warns otherwise).
sizes:
  s:
    target_params: 20_000_000
  m:
    target_params: 60_000_000
